<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" fill="none">
  <!-- Map Background -->
  <rect width="320" height="180" fill="#E2E8F0" rx="16" />
  
  <!-- Coastal water body (Vịnh Đà Nẵng) -->
  <path d="M0 0 L140 0 C120 40 100 80 80 120 C60 150 40 180 0 180 Z" fill="#BAE6FD" />
  <text x="20" y="30" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#0369A1" opacity="0.8">VỊNH ĐÀ NẴNG</text>
  
  <!-- Green Parks / Hills -->
  <path d="M220 0 L320 0 L320 80 C280 60 250 30 220 0 Z" fill="#BBF7D0" opacity="0.7" />
  
  <!-- Main Road (Đường Nguyễn Lương Bằng / QL1A) -->
  <path d="M40 180 Q120 100 240 0" stroke="#FFFFFF" stroke-width="12" />
  <path d="M40 180 Q120 100 240 0" stroke="#CBD5E1" stroke-width="10" />
  <path d="M40 180 Q120 100 240 0" stroke="#F8FAFC" stroke-width="6" />

  <!-- Secondary Road (Nguyễn Tất Thành ven biển) -->
  <path d="M60 180 Q100 80 130 0" stroke="#FFFFFF" stroke-width="8" />
  <path d="M60 180 Q100 80 130 0" stroke="#F1F5F9" stroke-width="5" />

  <!-- Connecting Streets -->
  <line x1="80" y1="120" x2="260" y2="150" stroke="#FFFFFF" stroke-width="6" />
  <line x1="120" y1="80" x2="280" y2="100" stroke="#FFFFFF" stroke-width="6" />
  <line x1="160" y1="50" x2="310" y2="65" stroke="#FFFFFF" stroke-width="6" />

  <!-- Road Labels -->
  <text x="140" y="140" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#64748B">Đ. Nguyễn Lương Bằng</text>

  <!-- Location Pin for Công an Phường Liên Chiểu -->
  <g transform="translate(160, 75)">
    <!-- Pulse ring -->
    <circle cx="0" cy="0" r="14" fill="#EF4444" opacity="0.25">
      <animate attributeName="r" values="8;18;8" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- Pin shadow -->
    <ellipse cx="0" cy="14" rx="6" ry="2.5" fill="#000000" opacity="0.3" />
    <!-- Pin body -->
    <path d="M0 14 C-7 6 -7 0 -7 -4 C-7 -8 -4 -11 0 -11 C4 -11 7 -8 7 -4 C7 0 7 6 0 14 Z" fill="#DC2626" />
    <circle cx="0" cy="-4" r="3" fill="#FFFFFF" />
  </g>

  <!-- Pin Label Tooltip -->
  <rect x="95" y="32" width="130" height="22" rx="6" fill="#1E293B" opacity="0.9" />
  <text x="160" y="47" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Công an Phường Liên Chiểu</text>
</svg>
